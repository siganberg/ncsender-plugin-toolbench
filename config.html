<script>
(function() {
  var FALLBACK_PORT = __SERVER_PORT__;
  var initialConfig = __INITIAL_CONFIG__;
  var TOOL_LABEL = '__TOOL_MENU_LABEL__';

  var resolveApiBaseUrl = function() {
    if (window.ncSender && typeof window.ncSender.getApiBaseUrl === 'function') {
      return window.ncSender.getApiBaseUrl(FALLBACK_PORT);
    }
    return '';
  };

  var BASE_URL = resolveApiBaseUrl();
  var INCH_TO_MM = 25.4;
  var MM_TO_INCH = 0.0393701;

  async function init() {
    try {
      var settingsResponse = await fetch(BASE_URL + '/api/settings');
      var appSettings = await settingsResponse.json();

      var unitsPreference = appSettings.unitsPreference || 'metric';
      var isImperial = unitsPreference === 'imperial';
      var distanceUnit = isImperial ? 'in' : 'mm';
      var feedRateUnit = isImperial ? 'in/min' : 'mm/min';

      if (TOOL_LABEL === 'Planer') {
        renderPlaner(isImperial, distanceUnit, feedRateUnit);
      } else if (TOOL_LABEL === 'Jointer/Cutter') {
        renderJointer(isImperial, distanceUnit, feedRateUnit);
      } else if (TOOL_LABEL === 'Boring') {
        renderBoring(isImperial, distanceUnit, feedRateUnit);
      } else {
        document.getElementById('toolbench-root').innerHTML =
          '<div style="padding: 30px; text-align: center; color: var(--color-text-secondary);">' +
          '<h3 style="color: var(--color-text-primary);">Unknown Tool</h3>' +
          '<p>Tool label "' + TOOL_LABEL + '" not recognized.</p></div>';
      }
    } catch (err) {
      console.error('ToolBench init error:', err);
      document.getElementById('toolbench-root').innerHTML =
        '<div style="padding: 30px; text-align: center; color: var(--color-text-secondary);">' +
        '<h3 style="color: var(--color-text-primary);">Error Loading Plugin</h3>' +
        '<p>' + err.message + '</p></div>';
    }
  }

  // === SHARED TOOLTIP HELPERS ===
  function createTooltip(useFixed) {
    var tooltip = document.createElement('div');
    tooltip.style.cssText =
      'position: ' + (useFixed ? 'fixed' : 'absolute') + ';' +
      'background: #d32f2f;' +
      'color: white;' +
      'padding: 8px 12px;' +
      'border-radius: 4px;' +
      'font-size: 0.85rem;' +
      'z-index: 10000;' +
      'pointer-events: none;' +
      'opacity: 0;' +
      'transition: opacity 0.2s;' +
      'box-shadow: 0 2px 8px rgba(0,0,0,0.2);';
    tooltip.style.setProperty('white-space', 'nowrap');
    document.body.appendChild(tooltip);

    var arrow = document.createElement('div');
    arrow.style.cssText =
      'position: absolute;' +
      'width: 0;' +
      'height: 0;' +
      'border-left: 6px solid transparent;' +
      'border-right: 6px solid transparent;' +
      'border-top: 6px solid #d32f2f;' +
      'bottom: -6px;' +
      'left: 50%;' +
      'transform: translateX(-50%);';
    tooltip.appendChild(arrow);

    return { tooltip: tooltip, arrow: arrow };
  }

  function makeShowTooltip(tooltip, arrow) {
    return function(element, message) {
      var rect = element.getBoundingClientRect();
      tooltip.textContent = message;
      tooltip.appendChild(arrow);
      tooltip.style.left = rect.left + (rect.width / 2) + 'px';
      tooltip.style.top = (rect.top - 10) + 'px';
      tooltip.style.transform = 'translate(-50%, -100%)';
      tooltip.style.opacity = '1';
      element.style.borderColor = '#d32f2f';
      element.focus();
    };
  }

  function makeHideTooltip(tooltip) {
    return function() {
      tooltip.style.opacity = '0';
      setTimeout(function() {
        tooltip.style.left = '-9999px';
      }, 200);
    };
  }

  function makeValidateInput(validationRules, customValidator) {
    return function(id, value) {
      var rules = validationRules[id];
      if (!rules) return null;
      var num = parseFloat(value);
      if (isNaN(num)) {
        return rules.label + ' must be a valid number';
      }
      if (rules.integer && !Number.isInteger(num)) {
        return rules.label + ' must be a whole number';
      }
      if (num < rules.min) {
        return rules.label + ' must be at least ' + rules.min;
      }
      if (num > rules.max) {
        return rules.label + ' must not exceed ' + rules.max;
      }
      if (customValidator) {
        var customError = customValidator(id, num);
        if (customError) return customError;
      }
      return null;
    };
  }

  function makeValidateAllInputs(validationRules, validateInput, showTooltip) {
    return function() {
      for (var id in validationRules) {
        var element = document.getElementById(id);
        if (!element) continue;
        if (element.disabled) continue;
        var error = validateInput(id, element.value);
        if (error) {
          showTooltip(element, error);
          return false;
        }
      }
      return true;
    };
  }

  function attachInputListeners(validationRules, validateInput, showTooltip, hideTooltip) {
    for (var id in validationRules) {
      (function(fieldId) {
        var element = document.getElementById(fieldId);
        if (element) {
          element.addEventListener('input', function() {
            this.style.borderColor = '';
            hideTooltip();
          });
          element.addEventListener('blur', function() {
            var error = validateInput(fieldId, this.value);
            if (error) {
              showTooltip(this, error);
              setTimeout(hideTooltip, 3000);
            }
          });
        }
      })(id);
    }
  }


  // =========================================================================
  // PLANER

  function renderPlaner(isImperial, distanceUnit, feedRateUnit) {

    var savedPlanerSettings = (initialConfig && initialConfig.planer) || {};
    var defaultPatternType = savedPlanerSettings.patternType != null ? savedPlanerSettings.patternType : (savedPlanerSettings.invertOrientation ? 'zigzagX' : 'zigzagY');

    var settings = {
      xDimension: convertToDisplay(savedPlanerSettings.xDimension != null ? savedPlanerSettings.xDimension : 100),
      yDimension: convertToDisplay(savedPlanerSettings.yDimension != null ? savedPlanerSettings.yDimension : 100),
      depthOfCut: convertToDisplay(savedPlanerSettings.depthOfCut != null ? savedPlanerSettings.depthOfCut : 0.5),
      targetDepth: convertToDisplay(savedPlanerSettings.targetDepth != null ? savedPlanerSettings.targetDepth : 0.5),
      bitDiameter: convertToDisplay(savedPlanerSettings.bitDiameter != null ? savedPlanerSettings.bitDiameter : 25.4),
      stepover: savedPlanerSettings.stepover != null ? savedPlanerSettings.stepover : 80,
      overrun: convertToDisplay(savedPlanerSettings.overrun != null ? savedPlanerSettings.overrun : 5),
      feedRate: convertToDisplay(savedPlanerSettings.feedRate != null ? savedPlanerSettings.feedRate : 2000),
      plungeFeedRate: convertToDisplay(savedPlanerSettings.plungeFeedRate != null ? savedPlanerSettings.plungeFeedRate : 200),
      spindleRpm: savedPlanerSettings.spindleRpm != null ? savedPlanerSettings.spindleRpm : 15000,
      spindleDelay: savedPlanerSettings.spindleDelay != null ? savedPlanerSettings.spindleDelay : 5,
      patternType: defaultPatternType,
      origin: savedPlanerSettings.origin || 'bottom-left',
      mistM7: savedPlanerSettings.mistM7 != null ? savedPlanerSettings.mistM7 : false,

    };

    var root = document.getElementById('toolbench-root');
    var html =

                      '<option value="zigzagY"' + (settings.patternType === 'zigzagY' ? ' selected' : '') + '>Vertical</option>' +
                      '<option value="spiral"' + (settings.patternType === 'spiral' ? ' selected' : '') + '>Spiral</option>' +
                    '</select>' +
                  '</div>' +
                  '<div class="origin-picker">' +
                    '<label>Origin</label>' +
                    '<div class="origin-grid">' +
                      '<input type="hidden" id="planerOrigin" value="' + settings.origin + '">' +
                      '<div class="origin-point planer-origin ' + (settings.origin === 'top-left' ? 'active' : '') + '" data-origin="top-left"></div>' +
                      '<div class="origin-point planer-origin ' + (settings.origin === 'top-right' ? 'active' : '') + '" data-origin="top-right"></div>' +
                      '<div class="origin-point planer-origin ' + (settings.origin === 'center' ? 'active' : '') + '" data-origin="center"></div>' +
                      '<div class="origin-point planer-origin ' + (settings.origin === 'bottom-left' ? 'active' : '') + '" data-origin="bottom-left"></div>' +
                      '<div class="origin-point planer-origin ' + (settings.origin === 'bottom-right' ? 'active' : '') + '" data-origin="bottom-right"></div>' +
                    '</div>' +
                  '</div>' +
                '</div>' +
                '<div class="form-row">' +
                  '<div class="form-group">' +
                    '<label for="xDimension">X Dimension (' + distanceUnit + ')</label>' +
                    '<input type="number" id="xDimension" step="0.1" value="' + settings.xDimension + '">' +
                  '</div>' +
                  '<div class="form-group">' +
                    '<label for="yDimension">Y Dimension (' + distanceUnit + ')</label>' +
                    '<input type="number" id="yDimension" step="0.1" value="' + settings.yDimension + '">' +
                  '</div>' +
                '</div>' +
                '<div class="form-row">' +
                  '<div class="form-group">' +
                    '<label for="depthOfCut">Depth of Cut (' + distanceUnit + ')</label>' +
                    '<input type="number" id="depthOfCut" step="0.1" value="' + settings.depthOfCut + '">' +
                  '</div>' +

                '<div class="form-row">' +
                  '<div class="form-group">' +

                  '</div>' +

                  '</div>' +
                '</div>' +
                '<div class="form-row coolant-row">' +
                  '<div class="coolant-label">Mist Coolant</div>' +
                  '<div class="coolant-control">' +
                    '<label class="toggle-switch">' +
                      '<input type="checkbox" id="mistM7"' + (settings.mistM7 ? ' checked' : '') + '>' +
                      '<span class="toggle-slider"></span>' +

                '<div class="form-row coolant-row">' +

                      '<input type="checkbox" id="floodM8"' + (settings.floodM8 ? ' checked' : '') + '>' +

      '<div class="plugin-dialog-footer">' +

          '<button type="button" class="btn btn-secondary" id="btnClose">Cancel</button>' +
          '<button type="button" class="btn btn-primary" id="btnGenerate">Generate G-code</button>' +
        '</div>' +
      '</div>' +
      '</div>';

    root.innerHTML = html;

    document.getElementById('btnClose').addEventListener('click', function() {
      window.postMessage({ type: 'close-plugin-dialog' }, '*');
    });
    document.getElementById('btnGenerate').addEventListener('click', function() {
      document.getElementById('planerForm').requestSubmit();
    });

    // Origin dot picker for planer
    var planerOriginInput = document.getElementById('planerOrigin');
    var planerOriginPoints = document.querySelectorAll('.planer-origin');
    for (var poi = 0; poi < planerOriginPoints.length; poi++) {
      (function(point) {
        point.addEventListener('click', function() {
          for (var pi = 0; pi < planerOriginPoints.length; pi++) {
            planerOriginPoints[pi].classList.remove('active');
          }
          point.classList.add('active');
          planerOriginInput.value = point.getAttribute('data-origin');
        });

    }

    initPlanerLogic(isImperial);
  }

  function initPlanerLogic(isImperial) {
    var validationRules = isImperial ? {
      xDimension: { min: 0.5, max: Infinity, label: 'X Dimension' },
      yDimension: { min: 0.5, max: Infinity, label: 'Y Dimension' },
      depthOfCut: { min: 0.003, max: 1, label: 'Depth of Cut' },
      targetDepth: { min: 0.003, max: 1, label: 'Target Depth' },
      bitDiameter: { min: 0.03, max: 2, label: 'Bit Diameter' },
      stepover: { min: 10, max: 100, label: 'Stepover' },
      overrun: { min: 0, max: 10, label: 'Overrun' },
      feedRate: { min: 1, max: 800, label: 'Feed Rate' },
      spindleRpm: { min: 2000, max: 24000, label: 'Spindle RPM' },
      spindleDelay: { min: 0, max: 30, label: 'Spindle Delay', integer: true }
    } : {
      xDimension: { min: 10, max: Infinity, label: 'X Dimension' },
      yDimension: { min: 10, max: Infinity, label: 'Y Dimension' },
      depthOfCut: { min: 0.1, max: 20, label: 'Depth of Cut' },
      targetDepth: { min: 0.1, max: 20, label: 'Target Depth' },
      bitDiameter: { min: 1, max: 50, label: 'Bit Diameter' },
      stepover: { min: 10, max: 100, label: 'Stepover' },
      overrun: { min: 0, max: 250, label: 'Overrun' },
      feedRate: { min: 1, max: 20000, label: 'Feed Rate' },
      spindleRpm: { min: 2000, max: 24000, label: 'Spindle RPM' },
      spindleDelay: { min: 0, max: 30, label: 'Spindle Delay', integer: true }
    };

    var ttObj = createTooltip(false);
    var showTooltip = makeShowTooltip(ttObj.tooltip, ttObj.arrow);
    var hideTooltip = makeHideTooltip(ttObj.tooltip);
    var validateInput = makeValidateInput(validationRules);
    var validateAllInputs = makeValidateAllInputs(validationRules, validateInput, showTooltip);
    attachInputListeners(validationRules, validateInput, showTooltip, hideTooltip);

    function addStartupSequence(gcode, options) {
      var mistM7 = options.mistM7, floodM8 = options.floodM8, spindleRpm = options.spindleRpm;
      var spindleDelay = options.spindleDelay, safeHeight = options.safeHeight;
      var currentDepth = options.currentDepth, previousDepth = options.previousDepth;
      var plungeFeedRate = options.plungeFeedRate;

      if (mistM7) {
        gcode.push('M7 ; Mist coolant on');
      }
      if (floodM8) {
        gcode.push('M8 ; Flood coolant on');
      }
      if (spindleRpm > 0) {
        gcode.push('M3 S' + spindleRpm + ' ; Start spindle');
      }
      if (spindleRpm > 0 && spindleDelay > 0) {
        gcode.push('G4 P' + spindleDelay + ' ; Wait ' + spindleDelay + ' seconds');
      }
      gcode.push('G0 Z' + safeHeight + ' ; Rapid to safe height');

      var rapidClearance = isImperial ? (2 * 0.0393701) : 2;
      var targetDepth = -currentDepth;
      var rapidDepth = -(previousDepth || 0) - rapidClearance;

      if (rapidDepth > targetDepth) {
        gcode.push('G0 Z' + rapidDepth.toFixed(3) + ' ; Rapid to 2mm above previous surface');
      }
      gcode.push('G1 Z' + targetDepth.toFixed(3) + ' F' + plungeFeedRate + ' ; Plunge to depth');
    }

    function generatePlanerGcode(params) {
      var startX = params.startX, startY = params.startY;
      var xDimension = params.xDimension, yDimension = params.yDimension;
      var depthOfCut = params.depthOfCut, targetDepth = params.targetDepth;
      var bitDiameter = params.bitDiameter, stepover = params.stepover;
      var overrun = params.overrun;
      var feedRate = params.feedRate, plungeFeedRate = params.plungeFeedRate;
      var spindleRpm = params.spindleRpm;
      var patternType = params.patternType, spindleDelay = params.spindleDelay;
      var mistM7 = params.mistM7, floodM8 = params.floodM8;

      var safeHeight = isImperial ? (5 * 0.0393701).toFixed(3) : '5.000';
      var unitsCode = isImperial ? 'G20' : 'G21';
      var unitsLabel = isImperial ? 'inch' : 'mm';

      var stepoverDistance = (bitDiameter * stepover) / 100;
      var numDepthPasses = Math.ceil(targetDepth / depthOfCut);
      var selectedPattern = patternType || 'zigzagY';
      var invertOrientation = selectedPattern === 'zigzagX';
      var isSpiral = selectedPattern === 'spiral';

      var adjustedStartX = startX - overrun;
      var adjustedStartY = startY - overrun;
      var adjustedXDimension = xDimension + (overrun * 2);
      var adjustedYDimension = yDimension + (overrun * 2);

      var stepDimension = invertOrientation ? adjustedYDimension : adjustedXDimension;
      var numPasses = Math.ceil(stepDimension / stepoverDistance) + 1;

      var gcode = [];
      gcode.push('(Planer Operation)');
      gcode.push('(Start: X' + startX + ' Y' + startY + ')');
      gcode.push('(Dimensions: ' + xDimension + ' x ' + yDimension + ' ' + unitsLabel + ')');
      gcode.push('(Overrun: ' + overrun + unitsLabel + ')');
      gcode.push('(Actual Cut Area: ' + adjustedXDimension + ' x ' + adjustedYDimension + ' ' + unitsLabel + ')');
      gcode.push('(Bit Diameter: ' + bitDiameter + unitsLabel + ', Stepover: ' + stepover + '%)');
      gcode.push('(Target Depth: ' + targetDepth + unitsLabel + ' in ' + numDepthPasses + ' passes)');
      gcode.push('(Feed Rate: ' + feedRate + unitsLabel + '/min, Spindle: ' + spindleRpm + 'RPM)');
      gcode.push('');
      gcode.push(unitsCode + ' ; ' + (isImperial ? 'Imperial' : 'Metric') + ' units');
      gcode.push('G90 ; Absolute positioning');
      gcode.push('G94 ; Feed rate per minute');
      gcode.push('');
      gcode.push('G53 G0 Z0 ; Move to machine Z0');
      gcode.push('');

      var currentDepth = 0;
      var previousDepth = 0;
      for (var depthPass = 0; depthPass < numDepthPasses; depthPass++) {
        previousDepth = currentDepth;
        currentDepth = Math.min(currentDepth + depthOfCut, targetDepth);
        gcode.push('(Depth pass ' + (depthPass + 1) + '/' + numDepthPasses + ' - Z' + (-currentDepth).toFixed(3) + ')');

        gcode.push('G0 X' + adjustedStartX.toFixed(3) + ' Y' + adjustedStartY.toFixed(3) + ' ; Move to start position');

        if (depthPass === 0) {
          addStartupSequence(gcode, { mistM7: mistM7, floodM8: floodM8, spindleRpm: spindleRpm, spindleDelay: spindleDelay, safeHeight: safeHeight, isImperial: isImperial, currentDepth: currentDepth, previousDepth: previousDepth, plungeFeedRate: plungeFeedRate });
        } else {
          var rapidClearance = isImperial ? (2 * 0.0393701) : 2;
          var td = -currentDepth;
          var rapidDepth = -previousDepth + rapidClearance;

          gcode.push('G0 Z' + safeHeight + ' ; Rapid to safe height');
          if (rapidDepth > td) {
            gcode.push('G0 Z' + rapidDepth.toFixed(3) + ' ; Rapid to 2mm above previous surface');
          }
          gcode.push('G1 Z' + td.toFixed(3) + ' F' + plungeFeedRate + ' ; Plunge to depth');
        }

        if (isSpiral) {
          var effectiveStep = Math.max(Math.min(stepoverDistance, Math.min(adjustedXDimension, adjustedYDimension) / 2), 0.1);
          var left = adjustedStartX;
          var right = adjustedStartX + adjustedXDimension;
          var top = adjustedStartY;
          var bottom = adjustedStartY + adjustedYDimension;
          var currentX = adjustedStartX;
          var currentY = adjustedStartY;

          while (right - left > 0 && bottom - top > 0) {
            gcode.push('G1 X' + right.toFixed(3) + ' Y' + top.toFixed(3) + ' F' + feedRate);
            currentX = right;
            currentY = top;

            top += effectiveStep;
            if (top >= bottom) break;

            gcode.push('G1 X' + currentX.toFixed(3) + ' Y' + bottom.toFixed(3) + ' F' + feedRate);
            currentY = bottom;

            right -= effectiveStep;
            if (left >= right) break;

            gcode.push('G1 X' + left.toFixed(3) + ' Y' + currentY.toFixed(3) + ' F' + feedRate);
            currentX = left;

            bottom -= effectiveStep;
            if (top >= bottom) break;

            gcode.push('G1 X' + currentX.toFixed(3) + ' Y' + top.toFixed(3) + ' F' + feedRate);
            currentY = top;

            left += effectiveStep;
            if (left >= right) break;

            gcode.push('G1 X' + left.toFixed(3) + ' Y' + currentY.toFixed(3) + ' F' + feedRate);
            currentX = left;
          }

          var centerX = adjustedStartX + (adjustedXDimension / 2);
          var centerY = adjustedStartY + (adjustedYDimension / 2);
          if (Math.abs(currentX - centerX) > 0.01 || Math.abs(currentY - centerY) > 0.01) {
            gcode.push('G1 X' + centerX.toFixed(3) + ' Y' + centerY.toFixed(3) + ' F' + feedRate);
          }
        } else {
          var direction = 1;

          if (invertOrientation) {
            for (var pass = 0; pass < numPasses; pass++) {
              var yPos = adjustedStartY + (pass * stepoverDistance);
              if (pass > 0) {
                gcode.push('G1 Y' + yPos.toFixed(3) + ' F' + feedRate + ' ; Step over');
              }
              if (direction === 1) {
                gcode.push('G1 X' + (adjustedStartX + adjustedXDimension).toFixed(3) + ' F' + feedRate);
              } else {
                gcode.push('G1 X' + adjustedStartX.toFixed(3) + ' F' + feedRate);
              }
              direction *= -1;
            }
          } else {
            for (var pass = 0; pass < numPasses; pass++) {
              var xPos = adjustedStartX + (pass * stepoverDistance);
              if (pass > 0) {
                gcode.push('G1 X' + xPos.toFixed(3) + ' F' + feedRate + ' ; Step over');
              }
              if (direction === 1) {
                gcode.push('G1 Y' + (adjustedStartY + adjustedYDimension).toFixed(3) + ' F' + feedRate);
              } else {
                gcode.push('G1 Y' + adjustedStartY.toFixed(3) + ' F' + feedRate);
              }
              direction *= -1;
            }
          }
        }

        gcode.push('G0 Z' + safeHeight + ' ; Retract to safe height');
        gcode.push('');
      }

      gcode.push('G53 G0 Z0 ; Move to machine Z0');
      if (mistM7 || floodM8) {
        gcode.push('M9 ; Coolant off');
      }
      if (spindleRpm > 0) {
        gcode.push('M5 ; Stop spindle');
      }
      gcode.push('M30 ; End program');

      return gcode.join('\n');
    }

    document.getElementById('planerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!validateAllInputs()) {
        return;
      }

      var patternTypeSelect = document.getElementById('patternType');
      var patternType = patternTypeSelect ? patternTypeSelect.value : 'zigzagY';
      var invertOrientation = patternType === 'zigzagX';
      var originInput = document.getElementById('planerOrigin');
      var origin = originInput ? originInput.value : 'bottom-left';

      var displayValues = {
        xDimension: parseFloat(document.getElementById('xDimension').value),
        yDimension: parseFloat(document.getElementById('yDimension').value),
        depthOfCut: parseFloat(document.getElementById('depthOfCut').value),
        targetDepth: parseFloat(document.getElementById('targetDepth').value),

        feedRate: parseFloat(document.getElementById('feedRate').value),

        spindleDelay: parseInt(document.getElementById('spindleDelay').value)
      };

      var response = await fetch(BASE_URL + '/api/plugins/com.ncsender.toolbench/settings');
      var savedSettings = response.ok ? await response.json() : {};
      var convertToDisplay = function(value) { return isImperial ? parseFloat((value * 0.0393701).toFixed(4)) : value; };
      var currentPlungeFeedRate = convertToDisplay(savedSettings.planer != null && savedSettings.planer.plungeFeedRate != null ? savedSettings.planer.plungeFeedRate : 200);

      var convertToMetric = function(value) { return isImperial ? value * INCH_TO_MM : value; };
      var settingsToSave = {
        planer: {
          xDimension: convertToMetric(displayValues.xDimension),
          yDimension: convertToMetric(displayValues.yDimension),
          depthOfCut: convertToMetric(displayValues.depthOfCut),
          targetDepth: convertToMetric(displayValues.targetDepth),
          bitDiameter: convertToMetric(displayValues.bitDiameter),
          stepover: displayValues.stepover,
          overrun: convertToMetric(displayValues.overrun),
          feedRate: convertToMetric(displayValues.feedRate),
          plungeFeedRate: convertToMetric(currentPlungeFeedRate),
          spindleRpm: displayValues.spindleRpm,
          spindleDelay: displayValues.spindleDelay,
          patternType: patternType,
          origin: origin,
          invertOrientation: invertOrientation,
          mistM7: displayValues.mistM7,
          floodM8: displayValues.floodM8
        }
      };

      // Calculate start position based on origin selection
      var xDim = displayValues.xDimension;
      var yDim = displayValues.yDimension;
      var startX = 0, startY = 0;
      switch (origin) {
        case 'bottom-right': startX = -xDim; break;
        case 'top-left': startY = -yDim; break;
        case 'top-right': startX = -xDim; startY = -yDim; break;
        case 'center': startX = -xDim / 2; startY = -yDim / 2; break;
      }

      var params = {
        startX: startX,
        startY: startY,
        xDimension: displayValues.xDimension,
        yDimension: displayValues.yDimension,
        depthOfCut: displayValues.depthOfCut,
        targetDepth: displayValues.targetDepth,
        bitDiameter: displayValues.bitDiameter,
        stepover: displayValues.stepover,
        overrun: displayValues.overrun,
        feedRate: displayValues.feedRate,
        plungeFeedRate: currentPlungeFeedRate,
        spindleRpm: displayValues.spindleRpm,
        spindleDelay: displayValues.spindleDelay,
        patternType: patternType,
        invertOrientation: invertOrientation,
        mistM7: displayValues.mistM7,
        floodM8: displayValues.floodM8,
        isImperial: isImperial
      };

      var gcode = generatePlanerGcode(params);

      fetch(BASE_URL + '/api/plugins/com.ncsender.toolbench/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(settingsToSave)
      }).catch(function(err) { console.error('Failed to save settings:', err); });

      try {
        var uploadResponse = await fetch(BASE_URL + '/api/gcode-files/load-temp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: 'Planer.nc', content: gcode })
        });

        if (uploadResponse.ok) {
          setTimeout(function() {
            window.postMessage({ type: 'close-plugin-dialog' }, '*');
          }, 100);
        } else {
          alert('Failed to upload G-code file');
        }
      } catch (error) {
        alert('Error uploading G-code file: ' + error.message);
      }
    });
  }

  function initJointerLogic(isImperial) {
    var validationRules = isImperial ? {
      edgeLength: { min: 1, max: 49, label: 'Edge Length' },
      depthOfCut: { min: 0.1, max: 4, label: 'Depth of Cut' },
      materialThickness: { min: 0.1, max: 4, label: 'Material Thickness' },
      trimWidth: { min: 0, max: 40, label: 'Trim Width' },
      numberOfPasses: { min: 1, max: 5, label: 'Number of Passes', integer: true },
      leadInOutDistance: { min: 0.1, max: 2, label: 'Lead-In/Out Distance' },
      bitDiameter: { min: 0.25, max: 2, label: 'Bit Diameter' },
      feedRate: { min: 1, max: 400, label: 'Feed Rate' },
      spindleRpm: { min: 1000, max: 24000, label: 'Spindle RPM' },
      spindleDelay: { min: 0, max: 30, label: 'Spindle Delay', integer: true }
    } : {
      edgeLength: { min: 10, max: 5000, label: 'Edge Length' },
      depthOfCut: { min: 0.1, max: 100, label: 'Depth of Cut' },
      materialThickness: { min: 1, max: 100, label: 'Material Thickness' },
      trimWidth: { min: 0, max: 1000, label: 'Trim Width' },
      numberOfPasses: { min: 1, max: 5, label: 'Number of Passes', integer: true },
      leadInOutDistance: { min: 1, max: 50, label: 'Lead-In/Out Distance' },
      bitDiameter: { min: 1, max: 50, label: 'Bit Diameter' },
      feedRate: { min: 1, max: 10000, label: 'Feed Rate' },
      spindleRpm: { min: 1000, max: 24000, label: 'Spindle RPM' },
      spindleDelay: { min: 0, max: 30, label: 'Spindle Delay', integer: true }
    };

    var ttObj = createTooltip(false);
    var showTooltip = makeShowTooltip(ttObj.tooltip, ttObj.arrow);
    var hideTooltip = makeHideTooltip(ttObj.tooltip);
    var validateInput = makeValidateInput(validationRules);
    var validateAllInputs = makeValidateAllInputs(validationRules, validateInput, showTooltip);
    attachInputListeners(validationRules, validateInput, showTooltip, hideTooltip);

    function addJointerStartupSequence(gcode, options) {
      var mistM7 = options.mistM7, floodM8 = options.floodM8, spindleRpm = options.spindleRpm;
      var spindleDelay = options.spindleDelay, safeHeight = options.safeHeight;
      var currentDepth = options.currentDepth, previousDepth = options.previousDepth;
      var plungeFeedRate = options.plungeFeedRate;

      if (mistM7) {
        gcode.push('M7 ; Mist coolant on');
      }
      if (floodM8) {
        gcode.push('M8 ; Flood coolant on');
      }
      if (spindleRpm > 0) {
        gcode.push('M3 S' + spindleRpm + ' ; Start spindle');
      }
      if (spindleRpm > 0 && spindleDelay > 0) {
        gcode.push('G4 P' + spindleDelay + ' ; Wait ' + spindleDelay + ' seconds');
      }
      gcode.push('G0 Z' + safeHeight + ' ; Rapid to safe height');

      var rapidClearance = isImperial ? (2 * 0.0393701) : 2;
      var targetDepth = -currentDepth;
      var rapidDepth = -(previousDepth || 0) - rapidClearance;

      if (rapidDepth > targetDepth) {
        gcode.push('G0 Z' + rapidDepth.toFixed(3) + ' ; Rapid to 2mm above previous surface');
      }
      gcode.push('G1 Z' + targetDepth.toFixed(3) + ' F' + plungeFeedRate + ' ; Plunge to depth');
    }

    function generateJointerGcode(params) {
      var edgeLength = params.edgeLength, edge = params.edge;
      var depthOfCut = params.depthOfCut, materialThickness = params.materialThickness;
      var trimWidth = params.trimWidth, numberOfPasses = params.numberOfPasses;
      var leadInOutDistance = params.leadInOutDistance, cutDirection = params.cutDirection;
      var bitDiameter = params.bitDiameter;
      var feedRate = params.feedRate, plungeFeedRate = params.plungeFeedRate;
      var spindleRpm = params.spindleRpm;
      var mistM7 = params.mistM7, floodM8 = params.floodM8;
      var spindleDelay = params.spindleDelay;

      var safeHeight = isImperial ? (5 * 0.0393701).toFixed(3) : '5.000';
      var unitsCode = isImperial ? 'G20' : 'G21';
      var unitsLabel = isImperial ? 'inch' : 'mm';

      var numDepthPasses = Math.ceil(materialThickness / depthOfCut);

      var gcode = [];
      gcode.push('(Jointer Operation)');
      gcode.push('(Edge: ' + edge + ')');
      gcode.push('(Edge Length: ' + edgeLength + unitsLabel + ')');
      gcode.push('(Material Thickness: ' + materialThickness + unitsLabel + ' in ' + numDepthPasses + ' depth passes)');
      gcode.push('(Trim Width: ' + trimWidth + unitsLabel + ', Passes: ' + numberOfPasses + ')');
      gcode.push('(Lead-In/Out: ' + leadInOutDistance + unitsLabel + ')');
      gcode.push('(Bit Diameter: ' + bitDiameter + unitsLabel + ')');
      gcode.push('(Feed Rate: ' + feedRate + unitsLabel + '/min, Spindle: ' + spindleRpm + 'RPM)');
      gcode.push('');
      gcode.push(unitsCode + ' ; ' + (isImperial ? 'Imperial' : 'Metric') + ' units');
      gcode.push('G90 ; Absolute positioning');
      gcode.push('G94 ; Feed rate per minute');
      gcode.push('');
      gcode.push('G53 G0 Z0 ; Move to machine Z0');
      gcode.push('');

      for (var pass = 0; pass < numberOfPasses; pass++) {
        var offset = (bitDiameter / 2) - trimWidth + (pass * trimWidth);
        gcode.push('(Trim pass ' + (pass + 1) + '/' + numberOfPasses + ' - Offset: ' + offset.toFixed(3) + unitsLabel + ')');

        var currentDepth = 0;
        var previousDepth = 0;
        for (var depthPass = 0; depthPass < numDepthPasses; depthPass++) {
          previousDepth = currentDepth;
          currentDepth = Math.min(currentDepth + depthOfCut, materialThickness);
          gcode.push('(Depth pass ' + (depthPass + 1) + '/' + numDepthPasses + ' - Z' + (-currentDepth).toFixed(3) + ')');

          if (edge === 'left') {
            var startX = -offset;
            var startY, endY;
            if (cutDirection === 'Conventional') {
              startY = edgeLength + leadInOutDistance;
              endY = -leadInOutDistance;
            } else {
              startY = -leadInOutDistance;
              endY = edgeLength + leadInOutDistance;
            }
            gcode.push('G0 X' + startX.toFixed(3) + ' Y' + startY.toFixed(3) + ' ; Move to start (with lead-in)');
            if (pass === 0 && depthPass === 0) {
              addJointerStartupSequence(gcode, { mistM7: mistM7, floodM8: floodM8, spindleRpm: spindleRpm, spindleDelay: spindleDelay, safeHeight: safeHeight, isImperial: isImperial, currentDepth: currentDepth, previousDepth: previousDepth, plungeFeedRate: plungeFeedRate });
            } else {
              var rapidClearance = isImperial ? (2 * 0.0393701) : 2;
              var td = -currentDepth;
              var rapidDepth = -previousDepth + rapidClearance;
              gcode.push('G0 Z' + safeHeight + ' ; Rapid to safe height');
              if (rapidDepth > td) {
                gcode.push('G0 Z' + rapidDepth.toFixed(3) + ' ; Rapid to 2mm above previous surface');
              }
              gcode.push('G1 Z' + td.toFixed(3) + ' F' + plungeFeedRate + ' ; Plunge to depth');
            }
            gcode.push('G1 Y' + endY.toFixed(3) + ' F' + feedRate + ' ; Cut along left edge (' + cutDirection.toLowerCase() + ')');
            gcode.push('G0 Z' + safeHeight + ' ; Retract');
          } else if (edge === 'right') {
            var startX = offset;
            var startY, endY;
            if (cutDirection === 'Conventional') {
              startY = -leadInOutDistance;
              endY = edgeLength + leadInOutDistance;
            } else {
              startY = edgeLength + leadInOutDistance;
              endY = -leadInOutDistance;
            }
            gcode.push('G0 X' + startX.toFixed(3) + ' Y' + startY.toFixed(3) + ' ; Move to start (with lead-in)');
            if (pass === 0 && depthPass === 0) {
              addJointerStartupSequence(gcode, { mistM7: mistM7, floodM8: floodM8, spindleRpm: spindleRpm, spindleDelay: spindleDelay, safeHeight: safeHeight, isImperial: isImperial, currentDepth: currentDepth, previousDepth: previousDepth, plungeFeedRate: plungeFeedRate });
            } else {
              var rapidClearance = isImperial ? (2 * 0.0393701) : 2;
              var td = -currentDepth;
              var rapidDepth = -previousDepth + rapidClearance;
              gcode.push('G0 Z' + safeHeight + ' ; Rapid to safe height');
              if (rapidDepth > td) {
                gcode.push('G0 Z' + rapidDepth.toFixed(3) + ' ; Rapid to 2mm above previous surface');
              }
              gcode.push('G1 Z' + td.toFixed(3) + ' F' + plungeFeedRate + ' ; Plunge to depth');
            }
            gcode.push('G1 Y' + endY.toFixed(3) + ' F' + feedRate + ' ; Cut along right edge (' + cutDirection.toLowerCase() + ')');
            gcode.push('G0 Z' + safeHeight + ' ; Retract');
          } else if (edge === 'front') {
            var startYf = offset;
            var startXf, endXf;
            if (cutDirection === 'Conventional') {
              startXf = edgeLength + leadInOutDistance;
              endXf = -leadInOutDistance;
            } else {
              startXf = -leadInOutDistance;
              endXf = edgeLength + leadInOutDistance;
            }
            gcode.push('G0 X' + startXf.toFixed(3) + ' Y' + startYf.toFixed(3) + ' ; Move to start (with lead-in)');
            if (pass === 0 && depthPass === 0) {
              addJointerStartupSequence(gcode, { mistM7: mistM7, floodM8: floodM8, spindleRpm: spindleRpm, spindleDelay: spindleDelay, safeHeight: safeHeight, isImperial: isImperial, currentDepth: currentDepth, previousDepth: previousDepth, plungeFeedRate: plungeFeedRate });
            } else {
              var rapidClearance = isImperial ? (2 * 0.0393701) : 2;
              var td = -currentDepth;
              var rapidDepth = -previousDepth + rapidClearance;
              gcode.push('G0 Z' + safeHeight + ' ; Rapid to safe height');
              if (rapidDepth > td) {
                gcode.push('G0 Z' + rapidDepth.toFixed(3) + ' ; Rapid to 2mm above previous surface');
              }
              gcode.push('G1 Z' + td.toFixed(3) + ' F' + plungeFeedRate + ' ; Plunge to depth');
            }
            gcode.push('G1 X' + endXf.toFixed(3) + ' F' + feedRate + ' ; Cut along front edge (' + cutDirection.toLowerCase() + ')');
            gcode.push('G0 Z' + safeHeight + ' ; Retract');
          } else {
            var startYb = -offset;
            var startXb, endXb;
            if (cutDirection === 'Conventional') {
              startXb = -leadInOutDistance;
              endXb = edgeLength + leadInOutDistance;
            } else {
              startXb = edgeLength + leadInOutDistance;
              endXb = -leadInOutDistance;
            }
            gcode.push('G0 X' + startXb.toFixed(3) + ' Y' + startYb.toFixed(3) + ' ; Move to start (with lead-in)');
            if (pass === 0 && depthPass === 0) {
              addJointerStartupSequence(gcode, { mistM7: mistM7, floodM8: floodM8, spindleRpm: spindleRpm, spindleDelay: spindleDelay, safeHeight: safeHeight, isImperial: isImperial, currentDepth: currentDepth, previousDepth: previousDepth, plungeFeedRate: plungeFeedRate });
            } else {
              var rapidClearance = isImperial ? (2 * 0.0393701) : 2;
              var td = -currentDepth;
              var rapidDepth = -previousDepth + rapidClearance;
              gcode.push('G0 Z' + safeHeight + ' ; Rapid to safe height');
              if (rapidDepth > td) {
                gcode.push('G0 Z' + rapidDepth.toFixed(3) + ' ; Rapid to 2mm above previous surface');
              }
              gcode.push('G1 Z' + td.toFixed(3) + ' F' + plungeFeedRate + ' ; Plunge to depth');
            }
            gcode.push('G1 X' + endXb.toFixed(3) + ' F' + feedRate + ' ; Cut along back edge (' + cutDirection.toLowerCase() + ')');
            gcode.push('G0 Z' + safeHeight + ' ; Retract');
          }
        }
        gcode.push('');
      }

      gcode.push('G53 G0 Z0 ; Move to machine Z0');
      if (mistM7 || floodM8) {
        gcode.push('M9 ; Coolant off');
      }
      if (spindleRpm > 0) {
        gcode.push('M5 ; Stop spindle');
      }
      gcode.push('M30 ; End program');

      return gcode.join('\n');
    }

      var settingsToSave = {

  function initBoringLogic(isImperial) {
    var validationRules = isImperial ? {

    } : {
      xCount: { min: 1, max: 200, label: 'X-Count', integer: true },
      yCount: { min: 1, max: 200, label: 'Y-Count', integer: true },
      xDistance: { min: 0.1, max: Infinity, label: 'X-Distance' },
      yDistance: { min: 0.1, max: Infinity, label: 'Y-Distance' },
      diameter: { min: 0.1, max: Infinity, label: 'Diameter' },
      rectWidth: { min: 0.1, max: Infinity, label: 'Width' },
      rectHeight: { min: 0.1, max: Infinity, label: 'Height' },
      depth: { min: 0.1, max: Infinity, label: 'Depth' },
      bitDiameter: { min: 0.1, max: Infinity, label: 'Bit Diameter' },
      pitch: { min: 0.1, max: 10, label: 'Pitch' },
      feedRate: { min: 1, max: Infinity, label: 'Feed Rate' },
      spindleRPM: { min: 1, max: 24000, label: 'Spindle RPM', integer: true },
      spindleDelay: { min: 0, max: 30, label: 'Spindle Delay', integer: true }
    };

    var customValidator = function(id, num) {
      if (id === 'xDistance' || id === 'yDistance') {
        var diameterInput = document.getElementById('diameter');
        if (diameterInput) {
          var diameter = parseFloat(diameterInput.value);
          if (!isNaN(diameter) && num < diameter) {
            return validationRules[id].label + ' must be at least the Diameter (' + diameter + ')';
          }
        }
      }
      if (id === 'diameter') {
        var bitDiameterInput = document.getElementById('bitDiameter');
        if (bitDiameterInput) {
          var bitDiameter = parseFloat(bitDiameterInput.value);
          if (!isNaN(bitDiameter) && num < bitDiameter) {
            return validationRules[id].label + ' must be at least the Bit Diameter (' + bitDiameter + ')';
          }
        }
      }
      return null;
    };

    var ttObj = createTooltip(true);
    var showTooltip = makeShowTooltip(ttObj.tooltip, ttObj.arrow);
    var hideTooltip = makeHideTooltip(ttObj.tooltip);
    var validateInput = makeValidateInput(validationRules, customValidator);
    var _baseValidateAll = makeValidateAllInputs(validationRules, validateInput, showTooltip);
    // Override to skip fields not relevant to current shape
    var validateAllInputs = function() {
      var shapeVal = document.getElementById('shape') ? document.getElementById('shape').value : 'round';
      for (var id in validationRules) {
        if (shapeVal === 'round' && (id === 'rectWidth' || id === 'rectHeight')) continue;
        if (shapeVal === 'rectangle' && id === 'diameter') continue;
        var element = document.getElementById(id);
        if (!element) continue;
        if (element.disabled) continue;
        var error = validateInput(id, element.value);
        if (error) {
          showTooltip(element, error);
          return false;
        }
      }
      return true;
    };
    attachInputListeners(validationRules, validateInput, showTooltip, hideTooltip);

    // Handle shape selector
    var shapeSelect = document.getElementById('shape');
    var roundFields = document.querySelectorAll('.round-fields');
    var rectFields = document.querySelectorAll('.rect-fields');

    function updateShapeFields() {
      var isRect = shapeSelect.value === 'rectangle';
      for (var i = 0; i < roundFields.length; i++) {
        if (isRect) { roundFields[i].classList.add('hidden'); } else { roundFields[i].classList.remove('hidden'); }
      }
      for (var j = 0; j < rectFields.length; j++) {
        if (isRect) { rectFields[j].classList.add('visible'); } else { rectFields[j].classList.remove('visible'); }
      }
      var diameterEl = document.getElementById('diameter');
      var rectWidthEl = document.getElementById('rectWidth');
      var rectHeightEl = document.getElementById('rectHeight');
      if (isRect) {
        diameterEl.removeAttribute('required');
        rectWidthEl.setAttribute('required', '');
        rectHeightEl.setAttribute('required', '');
      } else {
        diameterEl.setAttribute('required', '');
        rectWidthEl.removeAttribute('required');
        rectHeightEl.removeAttribute('required');
      }
    }

    shapeSelect.addEventListener('change', updateShapeFields);
    updateShapeFields();

    // Handle origin picker
    var originInput = document.getElementById('origin');
    var originPoints = document.querySelectorAll('.origin-point');
    for (var oi = 0; oi < originPoints.length; oi++) {
      (function(point) {
        point.addEventListener('click', function() {
          for (var pi = 0; pi < originPoints.length; pi++) {
            originPoints[pi].classList.remove('active');
          }
          point.classList.add('active');
          originInput.value = point.getAttribute('data-origin');
        });
      })(originPoints[oi]);
    }

    // When diameter changes, re-validate xDistance and yDistance
    var diameterInput = document.getElementById('diameter');

        }

      });

    // Handle cut type toggle
    var cutTypeToggle = document.getElementById('cutType');
    var innerLabel = document.getElementById('innerLabel');
    var outerLabel = document.getElementById('outerLabel');

    function updateCutTypeLabels() {
      if (cutTypeToggle.checked) {
        innerLabel.classList.remove('active');
        outerLabel.classList.add('active');
      } else {
        innerLabel.classList.add('active');
        outerLabel.classList.remove('active');
      }
    }

    cutTypeToggle.addEventListener('change', updateCutTypeLabels);

    // Handle X-Count and Y-Count changes to enable/disable distance inputs
    var xCountInput = document.getElementById('xCount');
    var xDistanceInput = document.getElementById('xDistance');
    var yCountInput = document.getElementById('yCount');
    var yDistanceInput = document.getElementById('yDistance');

    function updateDistanceInputs() {
      var xCount = parseInt(xCountInput.value);
      var yCount = parseInt(yCountInput.value);
      var diameter = parseFloat(diameterInput.value);

      xDistanceInput.disabled = xCount <= 1;
      yDistanceInput.disabled = yCount <= 1;

      if (xCount > 1 && !isNaN(diameter)) {
        var xDistance = parseFloat(xDistanceInput.value);
        if (isNaN(xDistance) || xDistance < diameter) {
          xDistanceInput.value = diameter;
        }
      }

      if (yCount > 1 && !isNaN(diameter)) {
        var yDistance = parseFloat(yDistanceInput.value);
        if (isNaN(yDistance) || yDistance < diameter) {
          yDistanceInput.value = diameter;
        }
      }
    }

    xCountInput.addEventListener('input', updateDistanceInputs);
    yCountInput.addEventListener('input', updateDistanceInputs);
    diameterInput.addEventListener('input', updateDistanceInputs);

    // Initialize on load
    updateDistanceInputs();

    function generateBoringGcode(params) {
      var shape = params.shape || 'round';
      var xCount = params.xCount, xDistance = params.xDistance;
      var yCount = params.yCount, yDistance = params.yDistance;
      var diameter = params.diameter, depth = params.depth;
      var rectWidth = params.rectWidth, rectHeight = params.rectHeight;
      var origin = params.origin || 'center';
      var cutType = params.cutType, bitDiameter = params.bitDiameter;
      var pitch = params.pitch;
      var feedRate = params.feedRate, plungeFeedRate = params.plungeFeedRate;
      var spindleRPM = params.spindleRPM, spindleDelay = params.spindleDelay;
      var mistM7 = params.mistM7, floodM8 = params.floodM8;

      var safeHeight = isImperial ? (5 * 0.0393701).toFixed(3) : '5.000';
      var unitsCode = isImperial ? 'G20' : 'G21';
      var unitsLabel = isImperial ? 'inch' : 'mm';
      var toolRadius = bitDiameter / 2;
      var zIncrement = pitch;

      // Determine the shape size for origin offset calculation
      var shapeW = shape === 'rectangle' ? rectWidth : diameter;
      var shapeH = shape === 'rectangle' ? rectHeight : diameter;

      // Calculate origin offset
      var originOffsetX = 0;
      var originOffsetY = 0;
      if (origin === 'center') {
        originOffsetX = -((xCount - 1) * xDistance) / 2;
        originOffsetY = -((yCount - 1) * yDistance) / 2;
      } else if (origin === 'top-left') {
        originOffsetX = shapeW / 2;
        originOffsetY = -((yCount - 1) * yDistance) - shapeH / 2;
      } else if (origin === 'top-right') {
        originOffsetX = -((xCount - 1) * xDistance) - shapeW / 2;
        originOffsetY = -((yCount - 1) * yDistance) - shapeH / 2;
      } else if (origin === 'bottom-left') {
        originOffsetX = shapeW / 2;
        originOffsetY = shapeH / 2;
      } else if (origin === 'bottom-right') {
        originOffsetX = -((xCount - 1) * xDistance) - shapeW / 2;
        originOffsetY = shapeH / 2;
      }

      var gcode = [];
      if (shape === 'rectangle') {
        gcode.push('(Rectangle Cut Operation)');
        gcode.push('(Pattern: ' + xCount + ' x ' + yCount + ')');
        gcode.push('(Size: ' + rectWidth + unitsLabel + ' x ' + rectHeight + unitsLabel + ', Depth: ' + depth + unitsLabel + ')');
      } else {
        gcode.push('(Boring Operation)');
        gcode.push('(Pattern: ' + xCount + ' x ' + yCount + ' holes)');
        gcode.push('(Hole Diameter: ' + diameter + unitsLabel + ', Depth: ' + depth + unitsLabel + ')');
      }
      gcode.push('(Cut Type: ' + cutType + ')');
      gcode.push('(Origin: ' + origin + ')');
      gcode.push('(Bit Diameter: ' + bitDiameter + unitsLabel + ')');
      gcode.push('(Pitch: ' + pitch + unitsLabel + ' per pass)');
      gcode.push('(X-Distance: ' + xDistance + unitsLabel + ', Y-Distance: ' + yDistance + unitsLabel + ')');
      gcode.push('');
      gcode.push(unitsCode + ' ; ' + (isImperial ? 'Imperial' : 'Metric') + ' units');
      gcode.push('G17 ; XY plane selection');
      gcode.push('G90 ; Absolute positioning');
      gcode.push('G94 ; Feed rate per minute');
      gcode.push('');
      gcode.push('G53 G0 Z0 ; Move to machine Z0');
      gcode.push('');

      var itemNumber = 0;
      for (var yi = 0; yi < yCount; yi++) {
        for (var xi = 0; xi < xCount; xi++) {
          itemNumber++;
          var centerX = xi * xDistance + originOffsetX;
          var centerY = yi * yDistance + originOffsetY;

          // Start coolant and spindle on first item
          if (itemNumber === 1) {
            if (mistM7) { gcode.push('M7 ; Mist coolant on'); }
            if (floodM8) { gcode.push('M8 ; Flood coolant on'); }
            if (spindleRPM > 0) {
              gcode.push('M3 S' + spindleRPM + ' ; Start spindle');
              if (spindleDelay > 0) {
                gcode.push('G4 P' + spindleDelay + ' ; Wait ' + spindleDelay + ' seconds');
              }
            }
          }

          if (shape === 'rectangle') {
            // --- RECTANGLE CUT ---
            // Calculate toolpath rectangle (tool center path)
            var halfW = rectWidth / 2;
            var halfH = rectHeight / 2;
            var pathHalfW, pathHalfH;
            if (cutType === 'inner') {
              pathHalfW = halfW - toolRadius;
              pathHalfH = halfH - toolRadius;
            } else {
              pathHalfW = halfW + toolRadius;
              pathHalfH = halfH + toolRadius;
            }

            if (pathHalfW <= 0 || pathHalfH <= 0) {
              gcode.push('(WARNING: Rectangle too small for tool diameter, skipping)');
              continue;
            }

            // Rectangle corners (CCW from bottom-right)
            var rx1 = centerX + pathHalfW;  // right
            var rx0 = centerX - pathHalfW;  // left
            var ry1 = centerY + pathHalfH;  // top
            var ry0 = centerY - pathHalfH;  // bottom

            gcode.push('(Rectangle ' + itemNumber + '/' + (xCount * yCount) + ' center X' + centerX.toFixed(3) + ' Y' + centerY.toFixed(3) + ')');

            // Perimeter length for distributing Z descent
            var perimeterLength = 2 * (pathHalfW * 2 + pathHalfH * 2);

            // Rapid to start position: mid-point of bottom edge
            var startX = centerX;
            var startY = ry0;
            gcode.push('G0 X' + startX.toFixed(3) + ' Y' + startY.toFixed(3));
            gcode.push('G0 Z' + safeHeight);

            var slowPlungeStart = isImperial ? (2 * 0.0393701) : 2;
            gcode.push('G0 Z' + slowPlungeStart.toFixed(3));

            // Plunge to first depth
            var firstDepth = Math.min(depth, zIncrement);
            gcode.push('G1 Z' + (-firstDepth).toFixed(3) + ' F' + plungeFeedRate);

            // Ramp along bottom edge to bottom-right corner while reaching first depth
            gcode.push('G1 X' + rx1.toFixed(3) + ' Y' + ry0.toFixed(3) + ' F' + feedRate);

            var currentDepth = firstDepth;
            var depthTolerance = 1e-6;

            // Cut perimeter laps, stepping down each lap
            // Each lap: BR -> TR -> TL -> BL -> BR (CCW)
            // Distribute Z descent evenly across the 4 sides
            while (currentDepth < depth - depthTolerance) {
              var nextDepth = Math.min(depth, currentDepth + zIncrement);
              var zPerSide = (nextDepth - currentDepth) / 4;

              // Bottom-right to top-right (right side, going up Y)
              var z1 = -(currentDepth + zPerSide);
              gcode.push('G1 X' + rx1.toFixed(3) + ' Y' + ry1.toFixed(3) + ' Z' + z1.toFixed(3));

              // Top-right to top-left (top side, going left)
              var z2 = -(currentDepth + zPerSide * 2);
              gcode.push('G1 X' + rx0.toFixed(3) + ' Y' + ry1.toFixed(3) + ' Z' + z2.toFixed(3));

              // Top-left to bottom-left (left side, going down Y)
              var z3 = -(currentDepth + zPerSide * 3);
              gcode.push('G1 X' + rx0.toFixed(3) + ' Y' + ry0.toFixed(3) + ' Z' + z3.toFixed(3));

              // Bottom-left to bottom-right (bottom side, going right)
              var z4 = -nextDepth;
              gcode.push('G1 X' + rx1.toFixed(3) + ' Y' + ry0.toFixed(3) + ' Z' + z4.toFixed(3));

              currentDepth = nextDepth;
            }

            // Final cleanup lap at full depth (no Z change)
            gcode.push('G1 X' + rx1.toFixed(3) + ' Y' + ry1.toFixed(3) + ' F' + feedRate);
            gcode.push('G1 X' + rx0.toFixed(3) + ' Y' + ry1.toFixed(3));
            gcode.push('G1 X' + rx0.toFixed(3) + ' Y' + ry0.toFixed(3));
            gcode.push('G1 X' + rx1.toFixed(3) + ' Y' + ry0.toFixed(3));

            // Retract
            gcode.push('G0 Z' + safeHeight);
            gcode.push('');

          } else {
            // --- ROUND CUT ---
            var holeX = centerX;
            var holeY = centerY;
            var holeRadius = diameter / 2;
            var pathRadius;
            if (cutType === 'inner') {
              pathRadius = holeRadius - toolRadius;
            } else {
              pathRadius = holeRadius + toolRadius;
            }

            gcode.push('(Hole ' + itemNumber + '/' + (xCount * yCount) + ' at X' + holeX.toFixed(3) + ' Y' + holeY.toFixed(3) + ')');

            var minEntryOffset = isImperial ? 0.005 : 0.1;
            var entryOffsetCandidate = Math.max(pathRadius * 0.0125, toolRadius * 0.25, minEntryOffset);
            var entryOffset = Math.min(pathRadius * 0.05, entryOffsetCandidate, pathRadius * 0.5);
            var approachStartOffset = Math.max(entryOffset, Math.min(pathRadius * 0.8, entryOffset * 2.5));
            var rStartX = holeX + pathRadius - approachStartOffset;
            var arcStartX = holeX + pathRadius - entryOffset;
            var rStartY = holeY - entryOffset;
            var rampXTravel = Math.max(arcStartX - rStartX, 0);

            gcode.push('G0 X' + rStartX.toFixed(3) + ' Y' + rStartY.toFixed(3));
            gcode.push('G0 Z' + safeHeight);

            var slowPlungeStart = isImperial ? (2 * 0.0393701) : 2;
            gcode.push('G0 Z' + slowPlungeStart.toFixed(3));

            var startDepth = Math.min(depth, zIncrement * 0.5);
            var rampTargetDepth = Math.min(depth, zIncrement);
            var rampDepthDiff = Math.max(0, rampTargetDepth - startDepth);
            gcode.push('G1 Z' + (-startDepth).toFixed(3) + ' F' + plungeFeedRate);

            var leadInSteps = 7;
            for (var step = 1; step <= leadInSteps; step++) {
              var progress = step / leadInSteps;
              var xPos = rStartX + (rampXTravel * progress);
              var zPos = -(startDepth + (rampDepthDiff * progress));
              gcode.push('X' + xPos.toFixed(3) + ' Z' + zPos.toFixed(3));
            }

            var arcCenterYOffset = entryOffset;
            gcode.push('G3 X' + (holeX + pathRadius).toFixed(3) + ' Y' + holeY.toFixed(3) + ' I0 J' + arcCenterYOffset.toFixed(3) + ' F' + feedRate);

            var currentDepth = rampTargetDepth;
            var depthTolerance = 1e-6;
            var zIncrementPerSemicircle = zIncrement / 2;
            var atPlusX = true;

            while (currentDepth < depth - depthTolerance) {
              var firstHalfDepth = Math.min(depth, currentDepth + zIncrementPerSemicircle);
              gcode.push('G3 X' + (holeX - pathRadius).toFixed(3) + ' Y' + holeY.toFixed(3) + ' I' + (-pathRadius).toFixed(3) + ' J0 Z' + (-firstHalfDepth).toFixed(3) + ' F' + feedRate);
              currentDepth = firstHalfDepth;
              atPlusX = false;

              if (currentDepth >= depth - depthTolerance) break;

              var secondHalfDepth = Math.min(depth, currentDepth + zIncrementPerSemicircle);
              gcode.push('G3 X' + (holeX + pathRadius).toFixed(3) + ' Y' + holeY.toFixed(3) + ' I' + pathRadius.toFixed(3) + ' J0 Z' + (-secondHalfDepth).toFixed(3) + ' F' + feedRate);
              currentDepth = secondHalfDepth;
              atPlusX = true;
            }

            if (atPlusX) {
              gcode.push('G3 X' + (holeX - pathRadius).toFixed(3) + ' Y' + holeY.toFixed(3) + ' I' + (-pathRadius).toFixed(3) + ' J0 F' + feedRate);
              gcode.push('G3 X' + (holeX + pathRadius).toFixed(3) + ' Y' + holeY.toFixed(3) + ' I' + pathRadius.toFixed(3) + ' J0 F' + feedRate);
            } else {
              gcode.push('G3 X' + (holeX + pathRadius).toFixed(3) + ' Y' + holeY.toFixed(3) + ' I' + pathRadius.toFixed(3) + ' J0 F' + feedRate);
              gcode.push('G3 X' + (holeX - pathRadius).toFixed(3) + ' Y' + holeY.toFixed(3) + ' I' + (-pathRadius).toFixed(3) + ' J0 F' + feedRate);
            }

            gcode.push('G0 Z' + safeHeight);
            gcode.push('');
          }
        }
      }

      gcode.push('G53 G0 Z0 ; Return to machine Z0');
      if (mistM7 || floodM8) {
        gcode.push('M9 ; Coolant off');
      }
      if (spindleRPM > 0) {
        gcode.push('M5 ; Stop spindle');
      }
      gcode.push('M30 ; Program end');

      return gcode.join('\n');
    }

    document.getElementById('boringForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!validateAllInputs()) {
        return;
      }

      var shape = document.getElementById('shape').value;
      var origin = document.getElementById('origin').value;
      var xCount = parseInt(document.getElementById('xCount').value);
      var xDistance = parseFloat(document.getElementById('xDistance').value);
      var yCount = parseInt(document.getElementById('yCount').value);
      var yDistance = parseFloat(document.getElementById('yDistance').value);
      var diameter = parseFloat(document.getElementById('diameter').value);
      var rectWidth = parseFloat(document.getElementById('rectWidth').value);
      var rectHeight = parseFloat(document.getElementById('rectHeight').value);
      var depth = parseFloat(document.getElementById('depth').value);
      var cutType = cutTypeToggle.checked ? 'outer' : 'inner';
      var bitDiameter = parseFloat(document.getElementById('bitDiameter').value);
      var pitch = parseFloat(document.getElementById('pitch').value);
      var feedRate = parseFloat(document.getElementById('feedRate').value);
      var spindleRPM = parseInt(document.getElementById('spindleRPM').value);
      var spindleDelay = parseInt(document.getElementById('spindleDelay').value);
      var mistM7 = document.getElementById('mistM7').checked;
      var floodM8 = document.getElementById('floodM8').checked;

      var displayValues = {
        shape: shape,
        origin: origin,
        xCount: xCount,
        xDistance: xDistance,
        yCount: yCount,
        yDistance: yDistance,
        diameter: diameter,
        rectWidth: rectWidth,
        rectHeight: rectHeight,
        depth: depth,
        cutType: cutType,
        bitDiameter: bitDiameter,
        pitch: pitch,
        feedRate: feedRate,
        spindleRPM: spindleRPM,
        spindleDelay: spindleDelay,
        mistM7: mistM7,
        floodM8: floodM8
      };

      var response = await fetch(BASE_URL + '/api/plugins/com.ncsender.toolbench/settings');
      var savedSettings = response.ok ? await response.json() : {};
      var convertToDisplayFn = function(value) { return isImperial ? parseFloat((value * 0.0393701).toFixed(4)) : value; };
      var currentPlungeFeedRate = convertToDisplayFn(savedSettings.boring != null && savedSettings.boring.plungeFeedRate != null ? savedSettings.boring.plungeFeedRate : 200);

      var convertToMetric = function(value) { return isImperial ? value * 25.4 : value; };

      var settingsToSave = {
        boring: {
          shape: displayValues.shape,
          origin: displayValues.origin,
          xCount: displayValues.xCount,
          xDistance: convertToMetric(displayValues.xDistance),
          yCount: displayValues.yCount,
          yDistance: convertToMetric(displayValues.yDistance),
          diameter: convertToMetric(displayValues.diameter),
          width: convertToMetric(displayValues.rectWidth),
          height: convertToMetric(displayValues.rectHeight),
          depth: convertToMetric(displayValues.depth),
          cutType: displayValues.cutType,
          toolDiameter: convertToMetric(displayValues.bitDiameter),
          pitch: convertToMetric(displayValues.pitch),
          feedRate: convertToMetric(displayValues.feedRate),
          plungeFeedRate: convertToMetric(currentPlungeFeedRate),
          spindleRPM: displayValues.spindleRPM,
          spindleDelay: displayValues.spindleDelay,
          mistM7: displayValues.mistM7,
          floodM8: displayValues.floodM8
        }
      };

      var gcodeParams = {
        shape: displayValues.shape,
        origin: displayValues.origin,
        xCount: displayValues.xCount,
        xDistance: displayValues.xDistance,
        yCount: displayValues.yCount,
        yDistance: displayValues.yDistance,
        diameter: displayValues.diameter,
        rectWidth: displayValues.rectWidth,
        rectHeight: displayValues.rectHeight,
        depth: displayValues.depth,
        cutType: displayValues.cutType,
        bitDiameter: displayValues.bitDiameter,
        pitch: displayValues.pitch,
        feedRate: displayValues.feedRate,
        plungeFeedRate: currentPlungeFeedRate,
        spindleRPM: displayValues.spindleRPM,
        spindleDelay: displayValues.spindleDelay,
        mistM7: displayValues.mistM7,
        floodM8: displayValues.floodM8,
        isImperial: isImperial
      };

      var gcode = generateBoringGcode(gcodeParams);

      fetch(BASE_URL + '/api/plugins/com.ncsender.toolbench/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(settingsToSave)
      }).catch(function(err) { console.error('Failed to save settings:', err); });

      try {
        var uploadResponse = await fetch(BASE_URL + '/api/gcode-files/load-temp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: 'Boring.nc', content: gcode })
        });

        if (uploadResponse.ok) {
          window.postMessage({ type: 'close-plugin-dialog' }, '*');
        } else {
          alert('Failed to upload G-code file');
        }
      } catch (error) {
        console.error('Upload error:', error);
        alert('Error uploading G-code file');
      }
    });
  }

  init();
})();
</script>
